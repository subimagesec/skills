name: validate-skills
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # Hash-pinned lockfile; regenerate on bump with:
      #   uv pip compile --generate-hashes (input: pydantic-ai-skills==<ver>)
      # Keep <ver> in lockstep with the version SubImage embeds (subimage-backend uv.lock).
      - run: pip install --require-hashes -r scripts/requirements.txt
      - run: python scripts/validate_skills.py
