name: validate-skills
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Hash-pinned lockfile; regenerate on bump with:
      #   uv pip compile --generate-hashes (input: pydantic-ai-skills==<ver>)
      # Keep <ver> in lockstep with the version SubImage embeds (subimage-backend uv.lock).
      - run: pip install --require-hashes -r scripts/requirements.txt
      - run: python scripts/validate_skills.py
