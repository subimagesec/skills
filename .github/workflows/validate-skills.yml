name: validate-skills
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pin in lockstep with the version SubImage embeds (subimage-backend uv.lock).
      - run: pip install "pydantic-ai-skills==0.9.0"
      - run: python scripts/validate_skills.py
